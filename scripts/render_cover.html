<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 630px;
      height: 500px;
      overflow: hidden;
      background: #0a0e14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .cover {
      width: 630px;
      height: 500px;
      padding: 34px 36px;
      background:
        radial-gradient(circle at 82% 20%, rgba(56, 189, 248, 0.22), transparent 46%),
        radial-gradient(circle at 18% 82%, rgba(245, 158, 11, 0.22), transparent 48%),
        linear-gradient(155deg, #0d131c 0%, #090c11 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(148, 163, 184, 0.16);
    }
    .top-badges {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .pill {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .pill-green {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #34d399;
    }
    .pill-cyan {
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #7dd3fc;
    }
    .title-block h1 {
      margin: 0 0 8px;
      font-size: 56px;
      line-height: 1.02;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #ffffff;
    }
    .title-block h1 span {
      color: #f59e0b;
    }
    .title-block p {
      margin: 0;
      font-size: 19px;
      color: #cbd5e1;
      font-weight: 500;
    }
    .scope-box {
      background: #05080c;
      border: 1.5px solid rgba(148, 163, 184, 0.32);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.48);
    }
    .scope-hud {
      display: flex;
      justify-content: space-between;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .scope-hud strong {
      color: #f59e0b;
    }
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .cta-pill {
      background: #f59e0b;
      color: #0b0f14;
      font-weight: 800;
      font-size: 16px;
      padding: 10px 18px;
      border-radius: 9px;
      letter-spacing: 0.01em;
    }
    .meta-txt {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="top-badges">
      <span class="pill pill-green">100% CC0 Public Domain</span>
      <span class="pill pill-cyan">Zero Generative AI</span>
    </div>
    <div class="title-block">
      <h1>SFX <span>FORGE</span></h1>
      <p>Procedural Game &amp; UI Sound Synthesizer</p>
    </div>
    <div class="scope-box">
      <div class="scope-hud">
        <span><strong>PRESETS: 12</strong> · COIN / LASER / UI CLICK / SWOOSH</span>
        <span>44.1kHz 16-BIT WAV</span>
      </div>
      <svg width="524" height="126" viewBox="0 0 524 126" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="63" x2="524" y2="63" stroke="rgba(148,163,184,0.22)" stroke-width="1"/>
        <!-- Spectrum bars -->
        <rect x="8" y="90" width="12" height="32" rx="2" fill="#38bdf8" opacity="0.55"/>
        <rect x="26" y="76" width="12" height="46" rx="2" fill="#38bdf8" opacity="0.65"/>
        <rect x="44" y="64" width="12" height="58" rx="2" fill="#38bdf8" opacity="0.75"/>
        <rect x="62" y="54" width="12" height="68" rx="2" fill="#38bdf8" opacity="0.82"/>
        <rect x="80" y="70" width="12" height="52" rx="2" fill="#38bdf8" opacity="0.68"/>
        <rect x="98" y="84" width="12" height="38" rx="2" fill="#38bdf8" opacity="0.58"/>
        <rect x="116" y="60" width="12" height="62" rx="2" fill="#38bdf8" opacity="0.72"/>
        <rect x="134" y="74" width="12" height="48" rx="2" fill="#38bdf8" opacity="0.64"/>
        <rect x="152" y="86" width="12" height="36" rx="2" fill="#38bdf8" opacity="0.55"/>
        <rect x="170" y="96" width="12" height="26" rx="2" fill="#38bdf8" opacity="0.48"/>
        <rect x="188" y="82" width="12" height="40" rx="2" fill="#f59e0b" opacity="0.62"/>
        <rect x="206" y="70" width="12" height="52" rx="2" fill="#f59e0b" opacity="0.72"/>
        <rect x="224" y="88" width="12" height="34" rx="2" fill="#f59e0b" opacity="0.52"/>
        <rect x="242" y="94" width="12" height="28" rx="2" fill="#f59e0b" opacity="0.45"/>
        <!-- Crisp hardware waveform -->
        <polyline fill="none" stroke="#f59e0b" stroke-width="3.2" stroke-linejoin="round"
          points="0,63 22,63 34,18 48,108 62,14 78,104 94,22 110,98 128,32 146,92 164,38 182,86 202,42 222,82 242,46 264,78 286,50 308,74 330,54 352,71 376,57 402,68 430,60 462,65 524,63"/>
      </svg>
    </div>
    <div class="bottom-bar">
      <span class="cta-pill">1-CLICK WAV &amp; ZIP PACKS</span>
      <span class="meta-txt">EACH-TOUCH FORGE · ZERO UPLOAD</span>
    </div>
  </div>
</body>
</html>
